name: Vendor Telemetry Contract

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Tag to vendor from chaithubk/medtech-telemetry-contract
          (leave empty to use the latest tag).
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    name: Vendor contract schema and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "${TAG}" ]; then
            TAG=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/chaithubk/medtech-telemetry-contract/tags" \
              | python3 -c "import sys,json; tags=json.load(sys.stdin); print(tags[0]['name'] if tags else '')")
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Could not resolve a target tag."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendoring contract at tag: ${TAG}"

      - name: Vendor new contract schema
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
        run: |
          pip install requests
          python tools/vendor_telemetry_contract.py "${{ steps.tag.outputs.tag }}"
      - name: Bump __version__ in src/__init__.py
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION=${VERSION#v}
          sed -i "s/^__version__ = .*/__version__ = '"$VERSION"'/" src/__init__.py

      - name: Check for changes
        id: diff
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git diff --quiet; then
            echo "No changes – already at ${TAG}."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CD_PAT }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BRANCH="chore/vendor-telemetry-contract-${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add contracts/vitals/current.json contracts/VITALS_CONTRACT_VERSION.txt src/__init__.py
          git commit -m "chore: vendor telemetry contract ${TAG}

          - Updated contracts/vitals/current.json from chaithubk/medtech-telemetry-contract@${TAG}
          - Updated contracts/VITALS_CONTRACT_VERSION.txt to ${TAG}
          - Bumped __version__ in src/__init__.py to ${TAG}"
          git push --force "https://x-access-token:${{ secrets.CD_PAT }}@github.com/${{ github.repository }}.git" "${BRANCH}"

      - name: Create or update PR
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CD_PAT }}
          branch: chore/vendor-telemetry-contract-${{ steps.tag.outputs.tag }}
          title: "chore: vendor telemetry contract ${{ steps.tag.outputs.tag }}"
          body: |
            ## Automated contract update

            Vendored schema from [`chaithubk/medtech-telemetry-contract@${{ steps.tag.outputs.tag }}`](https://github.com/chaithubk/medtech-telemetry-contract/releases/tag/${{ steps.tag.outputs.tag }}).

            ### Checklist
            - [ ] Review schema diff in `contracts/vitals/current.json`
            - [ ] Verify CI passes (schema validation test must pass)
            - [ ] Update parser / fixtures if any fields changed
            - [ ] Merge when green
          commit-message: "chore: vendor telemetry contract ${{ steps.tag.outputs.tag }} and bump version"
          base: main
