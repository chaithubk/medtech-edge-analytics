name: Synthea Sepsis Model Pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: write

concurrency:
  group: synthea-sepsis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SYNTHEA_PATIENTS: "10000"
      SYNTHEA_SEED: "12345"
      SYNTHEA_MODULES: "sepsis"
      SYNTHEA_VERSION: "3.3.0"
      RETRAIN_REASON: "${{ github.event_name }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas

      - name: Download Synthea
        run: |
          cd /tmp
          SYNTHEA_URL="https://github.com/synthetichealth/synthea/releases/download/v${SYNTHEA_VERSION}/synthea-with-dependencies.jar"
          echo "Downloading Synthea ${SYNTHEA_VERSION} from: ${SYNTHEA_URL}"
          curl -fsSL -o synthea-with-dependencies.jar "${SYNTHEA_URL}"
          echo "${SYNTHEA_VERSION}" > ${{ github.workspace }}/synthea_version.txt

      - name: Generate Synthea FHIR data
        run: |
          mkdir -p data/raw_fhir
          cd /tmp
          MODULE_ARGS=()
          if [ -n "${SYNTHEA_MODULES}" ]; then
            MODULE_ARGS=(-m "${SYNTHEA_MODULES}")
            echo "Using Synthea module filter: ${SYNTHEA_MODULES}"
          else
            echo "Using default Synthea module set"
          fi
          java -jar synthea-with-dependencies.jar \
            -p "${SYNTHEA_PATIENTS}" \
            -s "${SYNTHEA_SEED}" \
            -c "${{ github.workspace }}/tools/synthea_config.properties" \
            "${MODULE_ARGS[@]}" \
            --exporter.baseDirectory="${{ github.workspace }}/data/raw_fhir"

      - name: Inspect generated FHIR files
        run: |
          echo "FHIR output root: data/raw_fhir"
          JSON_COUNT=$(find data/raw_fhir -type f \( -name "*.json" -o -name "*.ndjson" \) | wc -l)
          echo "Discovered FHIR JSON/NDJSON files: ${JSON_COUNT}"
          find data/raw_fhir -maxdepth 3 -type f | head -n 20
          if [ "${JSON_COUNT}" -eq 0 ]; then
            echo "::error::No JSON/NDJSON FHIR files were generated under data/raw_fhir."
            exit 1
          fi

      - name: Flatten FHIR data to CSV
        run: python src/flatten_fhir.py

      - name: Generate realistic sample PSV data
        run: python scripts/generate_sample_data.py --seed 42

      - name: Process sample data (fallback for zero-sepsis Synthea)
        run: python src/process_fallback.py

      - name: Train model and export TFLite
        run: |
          mkdir -p artifacts/reports
          python src/train_and_convert.py 2>&1 | tee artifacts/reports/train_and_convert.log

      - name: Verify model artifact exists
        run: test -s models/imx8-compatible-sepsis.tflite

      - name: Build model metadata and run report
        run: python .github/scripts/build_model_metadata_and_report.py

      - name: Generate retraining summary
        if: always()
        run: bash .github/scripts/generate_retrain_summary.sh

      - name: Publish job summary
        run: |
          {
            cat artifacts/reports/pipeline_report.md
            echo ""
            echo "## Retraining Details"
            cat artifacts/reports/retrain_summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TFLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepsis-training-bundle
          path: |
            models/imx8-compatible-sepsis.tflite
            artifacts/reports/train_and_convert.log
            artifacts/reports/model_metadata.json
            artifacts/reports/pipeline_report.md
            artifacts/reports/retrain_summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Configure Git for auto-commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if model changed and commit
        id: commit
        run: bash .github/scripts/commit_model_artifact.sh

      - name: Create and push model release tag
        if: steps.commit.outputs.changed == 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG="models/$(cat synthea_version.txt)-${TIMESTAMP}"
          echo "Creating tag: ${TAG}"
          git tag -a "${TAG}" -m "Sepsis model release from training run ${{ github.run_id }}"
          git push origin "${TAG}"
          echo "Model tagged as: ${TAG}"

      - name: Create Pull Request with updated model
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update sepsis model from training pipeline"
          title: "Update sepsis model from training run"
          body: |
            Automated model training run from `synthea_sepsis_pipeline`
            
            Training run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
          branch: "model-update-${{ github.run_id }}"
          delete-branch: true
