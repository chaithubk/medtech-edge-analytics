name: Synthea Sepsis Model Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas

      - name: Download Synthea
        run: |
          cd /tmp
          wget -q https://github.com/synthetichealth/synthea/releases/download/master-branch/synthea-with-dependencies.jar
          cd -

      - name: Generate Synthea FHIR data
        run: |
          mkdir -p data/raw_fhir
          cd /tmp
          java -jar synthea-with-dependencies.jar \
            -p 1000 \
            -m sepsis \
            -s 12345 \
            -c ${{ github.workspace }}/tools/synthea_config.properties \
            -o ${{ github.workspace }}/data/raw_fhir/

      - name: Flatten FHIR data to CSV
        run: |
          python src/flatten_fhir.py

      - name: Train model and export TFLite
        run: |
          python src/train_and_convert.py

      - name: Upload TFLite artifact
        uses: actions/upload-artifact@v3
        with:
          name: imx8-compatible-sepsis
          path: models/imx8-compatible-sepsis.tflite
          retention-days: 30
