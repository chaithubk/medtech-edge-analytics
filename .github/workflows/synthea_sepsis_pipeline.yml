name: Synthea Sepsis Model Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Weekly retraining: Every Monday at 02:00 UTC

permissions:
  contents: read

concurrency:
  group: synthea-sepsis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SYNTHEA_PATIENTS: "1000"
      SYNTHEA_SEED: "12345"
      SYNTHEA_MODULES: ""
      SYNTHEA_VERSION: "3.3.0"
      RETRAIN_REASON: "${{ github.event_name }}"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas

      - name: Download Synthea
        run: |
          cd /tmp
          SYNTHEA_URL="https://github.com/synthetichealth/synthea/releases/download/v${SYNTHEA_VERSION}/synthea-with-dependencies.jar"
          echo "Downloading Synthea ${SYNTHEA_VERSION} from: ${SYNTHEA_URL}"
          curl -fsSL -o synthea-with-dependencies.jar "${SYNTHEA_URL}"
          echo "${SYNTHEA_VERSION}" > ${{ github.workspace }}/synthea_version.txt
          cd -

      - name: Generate Synthea FHIR data
        run: |
          mkdir -p data/raw_fhir
          cd /tmp

          MODULE_ARGS=()
          if [ -n "${SYNTHEA_MODULES}" ]; then
            MODULE_ARGS=(-m "${SYNTHEA_MODULES}")
            echo "Using Synthea module filter: ${SYNTHEA_MODULES}"
          else
            echo "Using default Synthea module set"
          fi

          java -jar synthea-with-dependencies.jar \
            -p ${SYNTHEA_PATIENTS} \
            -s ${SYNTHEA_SEED} \
            -c ${{ github.workspace }}/tools/synthea_config.properties \
            "${MODULE_ARGS[@]}" \
            --exporter.baseDirectory=${{ github.workspace }}/data/raw_fhir

      - name: Inspect generated FHIR files
        run: |
          echo "FHIR output root: data/raw_fhir"
          JSON_COUNT=$(find data/raw_fhir -type f \( -name "*.json" -o -name "*.ndjson" \) | wc -l)
          echo "Discovered FHIR JSON/NDJSON files: ${JSON_COUNT}"
          find data/raw_fhir -maxdepth 3 -type f | head -n 20
          if [ "${JSON_COUNT}" -eq 0 ]; then
            echo "::error::No JSON/NDJSON FHIR files were generated under data/raw_fhir."
            exit 1
          fi

      - name: Flatten FHIR data to CSV
        run: |
          python src/flatten_fhir.py

      - name: Train model and export TFLite
        run: |
          mkdir -p artifacts/reports
          python src/train_and_convert.py 2>&1 | tee artifacts/reports/train_and_convert.log

      - name: Verify model artifact exists
        run: |
          test -s models/imx8-compatible-sepsis.tflite

      - name: Build model metadata and run report
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import tensorflow as tf

          model_path = Path("models/imx8-compatible-sepsis.tflite")
          train_script = Path("src/train_and_convert.py")
          report_dir = Path("artifacts/reports")
          train_log_path = report_dir / "train_and_convert.log"
          report_dir.mkdir(parents=True, exist_ok=True)

          constants = {}
          source = train_script.read_text(encoding="utf-8")
          tree = ast.parse(source)
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in {
                          "EPOCHS",
                          "BATCH_SIZE",
                          "RANDOM_SEED",
                          "REPRESENTATIVE_DATASET_SIZE",
                      }:
                          constants[target.id] = ast.literal_eval(node.value)

          interpreter = tf.lite.Interpreter(model_path=str(model_path))
          interpreter.allocate_tensors()
          input_details = interpreter.get_input_details()[0]
          output_details = interpreter.get_output_details()[0]

          model_bytes = model_path.read_bytes()
          size_bytes = len(model_bytes)
          metric_patterns = {
              "loss": r"^\s*Loss:\s*([0-9]*\.?[0-9]+)",
              "compile_metrics": r"^\s*Compile_metrics:\s*([0-9]*\.?[0-9]+)",
          }
          parsed_metrics = {}
          if train_log_path.exists():
              log_text = train_log_path.read_text(encoding="utf-8", errors="ignore")
              for key, pattern in metric_patterns.items():
                  match = re.search(pattern, log_text, flags=re.MULTILINE)
                  if match:
                      parsed_metrics[key] = float(match.group(1))

          metadata = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "model_path": str(model_path),
              "model_size_bytes": size_bytes,
              "model_size_kb": round(size_bytes / 1024.0, 2),
              "model_sha256": hashlib.sha256(model_bytes).hexdigest(),
              "quantization": {
                  "input_dtype": str(input_details["dtype"].__name__),
                  "output_dtype": str(output_details["dtype"].__name__),
                  "input_quantization": list(input_details.get("quantization", ())),
                  "output_quantization": list(output_details.get("quantization", ())),
              },
              "training_config": {
                  "epochs": constants.get("EPOCHS"),
                  "batch_size": constants.get("BATCH_SIZE"),
                  "random_seed": constants.get("RANDOM_SEED"),
                  "representative_dataset_size": constants.get("REPRESENTATIVE_DATASET_SIZE"),
                  "synthea_patients": "${SYNTHEA_PATIENTS}",
                  "synthea_seed": "${SYNTHEA_SEED}",
              },
              "training_results": parsed_metrics,
          }

          metadata_path = report_dir / "model_metadata.json"
          metadata_path.write_text(json.dumps(metadata, indent=2), encoding="utf-8")

          report_path = report_dir / "pipeline_report.md"
          report = f"""# Synthea Sepsis Training Report

          ## Pipeline Outcome
          - Status: success
          - Generated model: `{metadata['model_path']}`
          - Model size: {metadata['model_size_kb']} KB ({metadata['model_size_bytes']} bytes)
          - SHA256: `{metadata['model_sha256']}`

          ## Training Configuration
          - Synthea patients: {metadata['training_config']['synthea_patients']}
          - Synthea seed: {metadata['training_config']['synthea_seed']}
          - Epochs: {metadata['training_config']['epochs']}
          - Batch size: {metadata['training_config']['batch_size']}
          - Random seed: {metadata['training_config']['random_seed']}
          - Representative dataset size: {metadata['training_config']['representative_dataset_size']}

          ## Training Results
          - Loss: {metadata['training_results'].get('loss', 'not parsed from log')}
          - Compile metrics: {metadata['training_results'].get('compile_metrics', 'not parsed from log')}

          ## Quantization Validation (TFLite)
          - Input dtype: `{metadata['quantization']['input_dtype']}`
          - Output dtype: `{metadata['quantization']['output_dtype']}`
          - Input quantization: `{metadata['quantization']['input_quantization']}`
          - Output quantization: `{metadata['quantization']['output_quantization']}`

          ## Evidence Artifacts
          - `artifacts/reports/train_and_convert.log`
          - `artifacts/reports/model_metadata.json`
          - `models/imx8-compatible-sepsis.tflite`
          """
          report_path.write_text("\n".join(line.strip() for line in report.splitlines()) + "\n", encoding="utf-8")
          PY

      - name: Generate retraining summary
        if: always()
        run: |
          mkdir -p artifacts/reports
          SYNTHEA_VERSION=$(cat synthea_version.txt)
          RETRAIN_TRIGGER="${{ github.event_name }}"
          MODEL_SIZE=$(stat -f%z models/imx8-compatible-sepsis.tflite 2>/dev/null || stat -c%s models/imx8-compatible-sepsis.tflite 2>/dev/null || echo "unknown")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > artifacts/reports/retrain_summary.md << 'EOF'
          # Automated Retraining Summary
          
          - **Timestamp:** $TIMESTAMP
          - **Synthea Version:** $SYNTHEA_VERSION
          - **Retraining Trigger:** $RETRAIN_TRIGGER
          - **Model Size:** $MODEL_SIZE bytes
          - **Git SHA:** ${{ github.sha }}
          - **Workflow Run:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ## Training Configuration
          - Synthea Patients: ${{ env.SYNTHEA_PATIENTS }}
          - Synthea Seed: ${{ env.SYNTHEA_SEED }}
          - Run ID: ${{ github.run_id }}
          
          ## Artifacts Generated
          - `models/imx8-compatible-sepsis.tflite` (quantized model)
          - `artifacts/reports/pipeline_report.md` (detailed training report)
          - `artifacts/reports/model_metadata.json` (model metadata)
          - `artifacts/reports/train_and_convert.log` (training logs)
          
          ## Next Steps
          - Review model performance metrics in `model_metadata.json`
          - Compare accuracy with previous versions
          - Deploy to edge devices if accuracy is acceptable
          EOF

      - name: Publish job summary
        run: |
          cat artifacts/reports/pipeline_report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Retraining Details" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/reports/retrain_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TFLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepsis-training-bundle
          path: |
            models/imx8-compatible-sepsis.tflite
            artifacts/reports/train_and_convert.log
            artifacts/reports/model_metadata.json
            artifacts/reports/pipeline_report.md
            artifacts/reports/retrain_summary.md
          if-no-files-found: error
          retention-days: 30
